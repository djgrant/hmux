packages:
  - packages/*
allowBuilds:
  '@google/genai': false
  protobufjs: false
minimumReleaseAgeExclude:
  # Our own packages are dogfooded from the registry; never gate them by release age.
  - '@djgrant/hmux'
  - 'terminal-focus'
  - '@hmux/*'
  - '@pokit/core@0.6.0'
  - '@pokit/terminal@0.6.0'
  - pokit@0.3.2
